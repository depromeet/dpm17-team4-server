spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: mySecretKeyForJWTWhichShouldBeAtLeast256BitsLongToEnsureSecurityAndCompliance
  expiration: 86400
  refresh-expiration: 604800

logging:
  level:
    org.springframework.web: DEBUG

kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-url: http://localhost:8080/api/auth/kakao/callback
  issuer-url: https://kauth.kakao.com
  auth-url: https://kauth.kakao.com/oauth/authorize
  token-url: https://kauth.kakao.com/oauth/token

frontend:
  url: http://localhost:3000

admin:
  emails: admin@example.com

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8080"

app:
  server:
    url: http://localhost:8080
