spring:
  application:
    name: server
  profiles:
    active: local
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO__CLIENT_ID:your-kakao-client-id}
            client-secret: ${KAKAO__CLIENT_SECRET:your-kakao-client-secret}
            redirect-uri: ${KAKAO__REDIRECT_URL:http://localhost:8080/api/auth/kakao/callback}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email
              - gender
              - age_range
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTWhichShouldBeAtLeast256BitsLongToEnsureSecurityAndCompliance}
  expiration: ${JWT_EXPIRATION:86400} # 24 hours in seconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800} # 7 days in seconds

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  file:
    name: logs/server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
      file-name-pattern: logs/server-%d{yyyy-MM-dd}.%i.log.gz

server:
  forward-headers-strategy: framework
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      prefix: access
      suffix: .log
      file-date-format: .yyyy-MM-dd
      rotate: true

kakao:
  client-id: ${KAKAO__CLIENT_ID:your-kakao-client-id}
  client-secret: ${KAKAO__CLIENT_SECRET:your-kakao-client-secret}
  redirect-url: ${KAKAO__REDIRECT_URL:http://localhost:8080/api/auth/kakao/callback}
  issuer-url: ${KAKAO__ISSUER_URL:https://kauth.kakao.com}
  auth-url: ${KAKAO__AUTH_URL:https://kauth.kakao.com/oauth/authorize}
  token-url: ${KAKAO__TOKEN_URL:https://kauth.kakao.com/oauth/token}

frontend:
  url: ${FRONTEND__URL:http://localhost:3000}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    request-snippets-enabled: true
    deep-linking: true
  api-docs:
    path: /v3/api-docs
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:true}

