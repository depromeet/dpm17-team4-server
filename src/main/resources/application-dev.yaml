spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./.h2/devdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2

app:
  server:
    url: ${APP__SERVER__URL:https://211.188.58.167}

cors:
  allowed-origins: "${CORS__ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://211.188.58.167:8080,http://211.188.58.167,https://211.188.58.167}"

logging:
  level:
    org.flywaydb: info
