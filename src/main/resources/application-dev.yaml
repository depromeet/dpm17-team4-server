spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dpm}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:dpm}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

app:
  server:
    url: ${APP__SERVER__URL:https://kkruk.com}

cors:
  allowed-origins: "${CORS__ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://kkruk.com:8080,http://kkruk.com,https://kkruk.com,http://211.188.58.167:8080,http://211.188.58.167,https://211.188.58.167}"

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: warn
